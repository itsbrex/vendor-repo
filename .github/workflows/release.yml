# Publishes to npm when a version tag is pushed: `npm version patch && git push --follow-tags`.
# Uses npm trusted publishing (OIDC): no token or secret, the package's npm settings list this
# repo and workflow as a trusted publisher. Skips versions already on npm, so tagging a release
# that was published by hand (e.g. via publish.sh) is a no-op.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Skip if this version is already published
        id: published
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm; skipping publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.already == 'false'
        # Trusted publishing needs npm 11.5.1+; Node 22 ships an older npm.
        run: npm install -g npm@latest && npm publish --provenance --access public
